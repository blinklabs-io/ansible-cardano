---
- name: Check install method
  vars:
    _allowed_install_methods: ['docker']
  ansible.builtin.assert:
    that:
      - dingo_install_method in _allowed_install_methods
    fail_msg: 'The specified install method ({{ dingo_install_method }}) is not one of the allowed values ({{ _allowed_install_methods | join(", ") }})'

- name: Check mainnet block producer version approval
  ansible.builtin.assert:
    that:
      - dingo_allow_unverified_mainnet_block_producer | bool
    fail_msg: >-
      Dingo {{ dingo_version }} is not approved for mainnet block production;
      set dingo_allow_unverified_mainnet_block_producer=true only after
      approving this version.
  when:
    - dingo_block_producer | bool
    - dingo_network == 'mainnet'
    - dingo_version == '0.80.0'

- name: Install chrony
  ansible.builtin.package:
    name: chrony
    state: present
  when: chrony_enabled

- name: Check topology input
  ansible.builtin.assert:
    that:
      - dingo_topology is mapping
    fail_msg: 'dingo_topology must be a mapping; use an empty mapping for legacy peer settings'
  when: dingo_manage_topology

- name: Create directories for persistent data
  ansible.builtin.file:
    state: directory
    path: '{{ item }}'
    owner: '{{ dingo_user | string }}'
    group: '{{ dingo_group | string }}'
    mode: '0755'
  loop:
    - '{{ dingo_db_dir }}'
    - '{{ dingo_ipc_dir }}'

- name: Create directories for topology
  ansible.builtin.file:
    state: directory
    path: '{{ item }}'
    owner: '{{ dingo_user | string }}'
    group: '{{ dingo_group | string }}'
    mode: '0755'
  loop:
    - '{{ dingo_topology_host_file | dirname }}'
  when: dingo_manage_topology

- name: Generate custom topology config
  ansible.builtin.template:
    dest: '{{ dingo_topology_host_file }}'
    src: custom-topology.json.j2
    owner: '{{ dingo_user | string }}'
    group: '{{ dingo_group | string }}'
    mode: '0644'
  register: cardano_topology
  when: dingo_manage_topology

- name: Create Dingo configuration directory
  ansible.builtin.file:
    state: directory
    path: '{{ dingo_node_config_file | dirname }}'
    owner: '{{ dingo_user | string }}'
    group: '{{ dingo_group | string }}'
    mode: '0755'
  when: dingo_manage_node_config | bool

- name: Write Dingo configuration
  ansible.builtin.copy:
    content: '{{ dingo_node_config | to_nice_yaml }}'
    dest: '{{ dingo_node_config_file }}'
    owner: '{{ dingo_user | string }}'
    group: '{{ dingo_group | string }}'
    mode: '0644'
  register: dingo_node_config_result
  when: dingo_manage_node_config | bool

- name: Include docker-related tasks
  ansible.builtin.include_tasks: docker.yml
  when: dingo_install_method == 'docker'
